<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishShift - AI-Powered Message Risk Scanner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
            margin-top: 20px;
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-align: center;
        }
        
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        
        .scan-section {
            margin-bottom: 30px;
        }
        
        label {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-weight: 600;
        }
        
        textarea {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        button {
            flex: 1;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .scan-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .scan-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .scan-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .clear-btn {
            background: #f5f5f5;
            color: #666;
        }
        
        .clear-btn:hover {
            background: #e0e0e0;
        }
        
        .results {
            display: none;
            margin-top: 30px;
            padding: 25px;
            border-radius: 8px;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .results.safe {
            background: #e8f5e9;
            border: 2px solid #4caf50;
        }
        
        .results.suspicious {
            background: #fff3e0;
            border: 2px solid #ff9800;
        }
        
        .results.dangerous {
            background: #ffebee;
            border: 2px solid #f44336;
        }
        
        .risk-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .risk-icon {
            font-size: 2em;
            margin-right: 15px;
        }
        
        .risk-label {
            font-size: 1.8em;
            font-weight: bold;
        }
        
        .risk-score {
            margin-left: auto;
            font-size: 2em;
            font-weight: bold;
        }
        
        .details {
            margin-top: 20px;
        }
        
        .detail-item {
            margin-bottom: 15px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 6px;
        }
        
        .detail-label {
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
        }
        
        .detail-value {
            color: #666;
        }
        
        .indicators {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }
        
        .indicator-tag {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.1);
        }
        
        .error {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #ffebee;
            border: 2px solid #f44336;
            border-radius: 8px;
            color: #c62828;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
            color: #667eea;
            font-weight: 600;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .footer {
            margin-top: 40px;
            text-align: center;
            color: white;
            font-size: 0.9em;
        }
        
        .footer a {
            color: white;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ PhishShift</h1>
        <p class="subtitle">AI-Powered Message Risk Scanner</p>
        
        <div class="scan-section">
            <label for="messageInput">Enter a message, email, or text to scan:</label>
            <textarea 
                id="messageInput" 
                placeholder="Paste your message here... We'll analyze it for potential threats including phishing attempts, suspicious links, and social engineering tactics."
            ></textarea>
            
            <div class="button-group">
                <button class="scan-btn" id="scanBtn">🔍 Scan Message</button>
                <button class="clear-btn" id="clearBtn">Clear</button>
            </div>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Analyzing message...</p>
        </div>
        
        <div class="error" id="error"></div>
        
        <div class="results" id="results">
            <div class="risk-header">
                <span class="risk-icon" id="riskIcon"></span>
                <span class="risk-label" id="riskLabel"></span>
                <span class="risk-score" id="riskScore"></span>
            </div>
            
            <div class="details">
                <div class="detail-item">
                    <div class="detail-label">ML Classification</div>
                    <div class="detail-value" id="mlClass"></div>
                </div>
                
                <div class="detail-item">
                    <div class="detail-label">ML Confidence</div>
                    <div class="detail-value" id="mlConfidence"></div>
                </div>
                
                <div class="detail-item">
                    <div class="detail-label">URLs Found</div>
                    <div class="detail-value" id="urlsFound"></div>
                </div>
                
                <div class="detail-item">
                    <div class="detail-label">Threat Indicators</div>
                    <div class="indicators" id="indicators"></div>
                </div>
                
                <div class="detail-item">
                    <div class="detail-label">Analysis Summary</div>
                    <div class="detail-value" id="summary"></div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="footer">
        <p>PhishShift uses machine learning and heuristic analysis to detect potential threats.</p>
        <p>Messages are analyzed in-memory and never stored or logged.</p>
    </div>
    
    <script>
        const messageInput = document.getElementById('messageInput');
        const scanBtn = document.getElementById('scanBtn');
        const clearBtn = document.getElementById('clearBtn');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const results = document.getElementById('results');
        
        scanBtn.addEventListener('click', async () => {
            const message = messageInput.value.trim();
            
            if (!message) {
                showError('Please enter a message to scan.');
                return;
            }
            
            hideResults();
            hideError();
            showLoading();
            scanBtn.disabled = true;
            
            try {
                const response = await fetch('/api/scan', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                displayResults(data);
            } catch (err) {
                showError('Failed to scan message. Please try again.');
                console.error('Scan error:', err);
            } finally {
                hideLoading();
                scanBtn.disabled = false;
            }
        });
        
        clearBtn.addEventListener('click', () => {
            messageInput.value = '';
            hideResults();
            hideError();
        });
        
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                scanBtn.click();
            }
        });
        
        function showLoading() {
            loading.style.display = 'block';
        }
        
        function hideLoading() {
            loading.style.display = 'none';
        }
        
        function showError(message) {
            error.textContent = message;
            error.style.display = 'block';
        }
        
        function hideError() {
            error.style.display = 'none';
        }
        
        function hideResults() {
            results.style.display = 'none';
        }
        
        function displayResults(data) {
            const riskScore = data.heuristic_risk_score || 0;
            const riskLevel = data.risk_level || 'unknown';
            
            // Set risk class
            results.className = 'results';
            if (riskLevel === 'safe') {
                results.classList.add('safe');
                document.getElementById('riskIcon').textContent = '✅';
                document.getElementById('riskLabel').textContent = 'Safe';
                document.getElementById('riskLabel').style.color = '#4caf50';
            } else if (riskLevel === 'suspicious') {
                results.classList.add('suspicious');
                document.getElementById('riskIcon').textContent = '⚠️';
                document.getElementById('riskLabel').textContent = 'Suspicious';
                document.getElementById('riskLabel').style.color = '#ff9800';
            } else {
                results.classList.add('dangerous');
                document.getElementById('riskIcon').textContent = '🚨';
                document.getElementById('riskLabel').textContent = 'Dangerous';
                document.getElementById('riskLabel').style.color = '#f44336';
            }
            
            // Set risk score
            document.getElementById('riskScore').textContent = riskScore + '/100';
            document.getElementById('riskScore').style.color = 
                riskLevel === 'safe' ? '#4caf50' : 
                riskLevel === 'suspicious' ? '#ff9800' : '#f44336';
            
            // ML Classification
            document.getElementById('mlClass').textContent = 
                data.ml_prediction?.predicted_class || 'N/A';
            
            // ML Confidence
            const confidence = data.ml_prediction?.confidence;
            document.getElementById('mlConfidence').textContent = 
                confidence ? `${(confidence * 100).toFixed(1)}%` : 'N/A';
            
            // URLs Found
            const urls = data.urls_found || [];
            document.getElementById('urlsFound').textContent = 
                urls.length > 0 ? urls.join(', ') : 'None detected';
            
            // Threat Indicators
            const indicators = data.content_indicators || {};
            const indicatorsDiv = document.getElementById('indicators');
            indicatorsDiv.innerHTML = '';
            
            const indicatorsList = [];
            if (indicators.urgency_detected) indicatorsList.push('Urgency');
            if (indicators.credential_request) indicatorsList.push('Credential Request');
            if (indicators.financial_coercion) indicatorsList.push('Financial Pressure');
            if (indicators.prize_claim) indicatorsList.push('Prize/Reward Claim');
            
            if (indicatorsList.length === 0) {
                indicatorsDiv.innerHTML = '<span class="detail-value">None detected</span>';
            } else {
                indicatorsList.forEach(ind => {
                    const tag = document.createElement('span');
                    tag.className = 'indicator-tag';
                    tag.textContent = ind;
                    indicatorsDiv.appendChild(tag);
                });
            }
            
            // Summary
            let summary = `This message received a risk score of ${riskScore}/100. `;
            if (riskLevel === 'safe') {
                summary += 'No significant threats were detected.';
            } else if (riskLevel === 'suspicious') {
                summary += 'Some suspicious patterns were detected. Exercise caution.';
            } else {
                summary += 'Multiple threat indicators detected. This message is likely dangerous.';
            }
            document.getElementById('summary').textContent = summary;
            
            // Show results
            results.style.display = 'block';
        }
    </script>
    
    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
